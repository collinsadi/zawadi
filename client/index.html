<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Zawadi — Onchain Gifting & Rewards</title>
    <meta name="title" content="Zawadi — Onchain Gifting & Rewards" />
    <meta
      name="description"
      content="Zawadi makes onchain gifting, bounties, and rewards seamless. Create, share, and redeem crypto-powered gifts with trustless smart contracts."
    />
    <meta
      name="keywords"
      content="Zawadi, crypto gifts, onchain rewards, bounties, web3 gifting, smart contract escrow, blockchain, Ethereum"
    />
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/zawadi.jpg" />
    <link rel="apple-touch-icon" href="/zawadi.jpg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Zawadi — Onchain Gifting & Rewards" />
    <meta
      property="og:description"
      content="Zawadi makes onchain gifting, bounties, and rewards seamless. Create, share, and redeem crypto-powered gifts with trustless smart contracts."
    />
    <meta property="og:image" content="/zawadi.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zawadi — Onchain Gifting & Rewards" />
    <meta
      name="twitter:description"
      content="Zawadi makes onchain gifting, bounties, and rewards seamless. Create, share, and redeem crypto-powered gifts with trustless smart contracts."
    />
    <meta name="twitter:image" content="/zawadi.jpg" />
    <script>
      (function () {
        try {
          const ls = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const shouldDark = ls === 'dark' || (!ls && prefersDark);
          const root = document.documentElement;
          if (shouldDark) root.classList.add('dark');
          else root.classList.remove('dark');
        } catch (_) {
          // no-op
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
